<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Net - Xem Phim Nhóm & Video Call</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        iframe { background-color: #000; }
    </style>
</head>
<body>

    <div id="auth-container" class="flex flex-col items-center justify-center min-h-screen px-4">
        <div class="bg-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-700">
            <h2 id="auth-title" class="text-3xl font-bold mb-6 text-center text-teal-400">Đăng Nhập</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Tài khoản</label>
                    <input type="text" id="auth-username" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-teal-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Mật khẩu</label>
                    <input type="password" id="auth-password" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-teal-500">
                </div>
                <button onclick="handleAuth()" id="auth-btn" class="w-full bg-teal-500 hover:bg-teal-600 text-slate-900 font-bold py-2 rounded-lg transition mt-2">Đăng Nhập</button>
            </div>
            
            <p class="text-sm text-slate-400 mt-4 text-center">
                <span id="auth-toggle-text">Chưa có tài khoản?</span> 
                <button onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-teal-400 hover:underline font-medium ml-1">Đăng ký ngay</button>
            </p>
        </div>
    </div>

    <div id="main-container" class="hidden min-h-screen flex flex-col">
        <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-teal-400">🎬 Cinema Net</h1>
            <div class="flex items-center gap-4">
                <span id="user-display" class="text-slate-300 font-medium"></span>
                <button onclick="handleLogout()" class="bg-rose-500/20 hover:bg-rose-500 text-rose-400 hover:text-white px-3 py-1 rounded-lg text-sm font-medium transition">Đăng xuất</button>
            </div>
        </header>

        <main class="flex-1 grid grid-cols-1 lg:grid-cols-4 gap-4 p-4">
            <div class="lg:col-span-3 flex flex-col gap-4">
                <div id="admin-controls" class="hidden bg-slate-800 p-4 rounded-xl border border-slate-700">
                    <h3 class="text-sm font-semibold text-slate-400 mb-2">QUẢN TRỊ VIÊN: THÊM / ĐỔI LINK PHIM</h3>
                    <div class="flex flex-col sm:flex-row gap-3">
                        <input type="text" id="movie-title" placeholder="Tên phim/Video..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-teal-500">
                        <input type="text" id="movie-url" placeholder="Link YouTube hoặc TikTok..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-teal-500">
                        <button onclick="updateMovieLink()" class="bg-teal-500 hover:bg-teal-600 text-slate-900 font-bold px-6 py-2 rounded-lg text-sm transition">Cập nhật</button>
                    </div>
                </div>

                <div class="flex-1 bg-slate-950 rounded-xl overflow-hidden aspect-video relative border border-slate-800 shadow-2xl">
                    <div id="video-placeholder" class="absolute inset-0 flex flex-col items-center justify-center p-4 text-slate-500">
                        <p class="text-lg">Chưa có video nào được phát</p>
                        <p class="text-sm">Admin vui lòng thêm link để bắt đầu xem phòng nhóm</p>
                    </div>
                    <div id="player-container" class="w-full h-full hidden">
                        </div>
                </div>
            </div>

            <div class="bg-slate-800 rounded-xl border border-slate-700 flex flex-col h-[600px] lg:h-auto">
                <div class="p-4 border-b border-slate-700 bg-slate-900/50 rounded-t-xl">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-teal-400 flex items-center gap-2">📹 Phòng Gọi Nhóm</h3>
                        <button onclick="toggleVideoCall()" id="call-btn" class="bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-bold px-3 py-1 rounded-lg text-xs transition">Bật Camera</button>
                    </div>
                    <div id="video-grid" class="grid grid-cols-2 gap-2 hidden">
                        <div class="bg-slate-950 aspect-video rounded-lg overflow-hidden relative border border-slate-700">
                            <video id="local-video" autoplay playsinline muted class="w-full h-full object-cover"></video>
                            <span class="absolute bottom-1 left-1 bg-slate-900/80 text-[10px] px-1.5 py-0.5 rounded text-slate-300">Bạn</span>
                        </div>
                        <div class="bg-slate-950 aspect-video rounded-lg overflow-hidden relative border border-slate-700 flex items-center justify-center">
                            <video id="remote-video" autoplay playsinline class="w-full h-full object-cover hidden"></video>
                            <span id="remote-status" class="text-[10px] text-slate-500">Chờ kết nối...</span>
                            <span class="absolute bottom-1 left-1 bg-slate-900/80 text-[10px] px-1.5 py-0.5 rounded text-slate-300">Bạn bè</span>
                        </div>
                    </div>
                </div>

                <div class="flex-1 flex flex-col overflow-hidden">
                    <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 text-sm">
                        </div>
                    <div class="p-3 border-t border-slate-700 bg-slate-900/30 flex gap-2">
                        <input type="text" id="chat-input" onkeypress="if(event.key === 'Enter') sendChatMessage()" placeholder="Nhập tin nhắn..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-teal-500">
                        <button onclick="sendChatMessage()" class="bg-teal-500 hover:bg-teal-600 text-slate-900 font-bold px-4 py-2 rounded-lg text-sm transition">Gửi</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 1. Cấu hình thông tin kết nối Supabase của Kiên
        const SUPABASE_URL = "https://xycuajdatwcxmzneikvl.supabase.co";
        const SUPABASE_KEY = "sb_publishable_KiW3TwdbdzfphJOiqV1dZQ_Ahv4-4Om"; // Thay key chuẩn nếu cần
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Biến trạng thái toàn cục
        let isLoginMode = true;
        let currentUser = null;
        let currentRole = 'user';
        let localStream = null;
        let peerConnection = null;

        // Cấu hình máy chủ WebRTC trung gian kết nối cuộc gọi miễn phí của Google
        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        // Kiểm tra xem đã đăng nhập sẵn trước đó chưa
        window.onload = function() {
            const savedUser = localStorage.getItem('cinema_user');
            const savedRole = localStorage.getItem('cinema_role');
            if (savedUser) {
                loginSuccess(savedUser, savedRole);
            }
        };

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? 'Đăng Nhập' : 'Đăng Ký';
            document.getElementById('auth-btn').innerText = isLoginMode ? 'Đăng Nhập' : 'Đăng Ký Thành Viên';
            document.getElementById('auth-toggle-text').innerText = isLoginMode ? 'Chưa có tài khoản?' : 'Đã có tài khoản?';
            document.getElementById('auth-toggle-btn').innerText = isLoginMode ? 'Đăng ký ngay' : 'Đăng nhập tại đây';
        }

        // Xử lý logic Đăng nhập / Đăng ký kết nối tiếng Việt với Supabase
        async function handleAuth() {
            const userVal = document.getElementById('auth-username').value.trim();
            const passVal = document.getElementById('auth-password').value.trim();

            if (!userVal || !passVal) {
                alert('Vui lòng điền đầy đủ tài khoản và mật khẩu!');
                return;
            }

            if (isLoginMode) {
                // ĐĂNG NHẬP: Đọc từ bảng tiếng Việt 'người dùng' và cột 'người dùng'
                const { data, error } = await _supabase
                    .from('người dùng')
                    .select('*')
                    .eq('người dùng', userVal)
                    .eq('pass', passVal);

                if (error) {
                    alert('Lỗi đăng nhập hệ thống: ' + error.message);
                } else if (data && data.length > 0) {
                    loginSuccess(data[0]['người dùng'], data[0]['role'] || 'user');
                } else {
                    alert('Sai tài khoản hoặc mật khẩu rồi Kiên ơi, kiểm tra lại nhé!');
                }
            } else {
                // ĐĂNG KÝ: Chèn vào bảng tiếng Việt 'người dùng'
                const roleVal = (userVal === 'Kienpro888') ? 'admin' : 'user';
                const { error } = await _supabase
                    .from('người dùng')
                    .insert([{ "người dùng": userVal, "pass": passVal, "role": roleVal }]);

                if (error) {
                    if (error.message.includes('duplicate')) {
                        alert('Tên tài khoản này đã có người đăng ký rồi!');
                    } else {
                        alert('Lỗi đăng ký tài khoản: ' + error.message);
                    }
                } else {
                    alert('Đăng ký thành công mỹ mãn! Hãy tiến hành đăng nhập.');
                    toggleAuthMode();
                }
            }
        }

        function loginSuccess(username, role) {
            currentUser = username;
            currentRole = role;
            localStorage.setItem('cinema_user', username);
            localStorage.setItem('cinema_role', role);

            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('main-container').classList.remove('hidden');
            document.getElementById('user-display').innerText = `👋 Chào, ${username} (${role})`;

            // Nếu đúng tài khoản admin Kienpro888 thì mở bảng điều khiển phim lên
            if (role === 'admin' || username === 'Kienpro888') {
                document.getElementById('admin-controls').classList.remove('hidden');
            }

            // Kích hoạt đồng bộ hóa thời gian thực (Realtime) dữ liệu Phim và Chat
            listenToMovieUpdates();
            listenToChatMessages();
            loadInitialChat();
        }

        function handleLogout() {
            localStorage.removeItem('cinema_user');
            localStorage.removeItem('cinema_role');
            location.reload();
        }

        // ================= XỬ LÝ PHIM (BẢNG MOVIES) =================
        async function updateMovieLink() {
            const title = document.getElementById('movie-title').value.trim();
            const url = document.getElementById('movie-url').value.trim();

            if (!title || !url) {
                alert('Vui lòng điền đủ cả tên phim và đường dẫn link nhé!');
                return;
            }

            // Xác định loại link
            let type = 'youtube';
            if (url.includes('tiktok.com')) type = 'tiktok';

            // Lưu phim mới vào bảng dữ liệu 'movies' tiếng Anh chuẩn
            const { error } = await _supabase
                .from('movies')
                .insert([{ title: title, url: url, type: type, added_by: currentUser }]);

            if (error) {
                alert('Không thêm được phim: ' + error.message);
            } else {
                document.getElementById('movie-title').value = '';
                document.getElementById('movie-url').value = '';
                alert('Đã cập nhật link phim mới lên phòng chiếu nhóm!');
            }
        }

        function listenToMovieUpdates() {
            // Lấy phim đang chạy mới nhất hiện tại
            _supabase.from('movies').select('*').order('created_at', { ascending: false }).limit(1)
                .then(({ data }) => { if(data && data.length > 0) renderPlayer(data[0]); });

            // Lắng nghe xem khi nào admin chèn phim mới vào để tự đổi màn hình
            _supabase.channel('movie_channel')
                .on('postgres_changes', { event: 'INSERT', scheme: 'public', table: 'movies' }, payload => {
                    renderPlayer(payload.new);
                }).subscribe();
        }

        function renderPlayer(movie) {
            document.getElementById('video-placeholder').classList.add('hidden');
            const container = document.getElementById('player-container');
            container.classList.remove('hidden');

            let embedUrl = '';
            if (movie.type === 'youtube') {
                let videoId = '';
                if(movie.url.includes('v=')) videoId = movie.url.split('v=')[1].split('&')[0];
                else if(movie.url.includes('youtu.be/')) videoId = movie.url.split('youtu.be/')[1].split('?')[0];
                embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
                container.innerHTML = `<iframe src="${embedUrl}" class="w-full h-full" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
            } else if (movie.type === 'tiktok') {
                // Xử lý nhúng mã nháp cho TikTok Video
                let videoId = movie.url.split('/video/')[1]?.split('?')[0] || '';
                container.innerHTML = `<iframe src="https://www.tiktok.com/embed/v2/${videoId}" class="w-full h-full" allowfullscreen></iframe>`;
            }
        }

        // ================= XỬ LÝ NHẮN TIN CHAT (BẢNG CHATS) =================
        async function loadInitialChat() {
            const { data } = await _supabase.from('chats').select('*').order('created_at', { ascending: true }).limit(50);
            if (data) {
                const box = document.getElementById('chat-messages');
                box.innerHTML = '';
                data.forEach(msg => appendMessage(msg));
                box.scrollTop = box.scrollHeight;
            }
        }

        function listenToChatMessages() {
            _supabase.channel('chat_channel')
                .on('postgres_changes', { event: 'INSERT', scheme: 'public', table: 'chats' }, payload => {
                    appendMessage(payload.new);
                    const box = document.getElementById('chat-messages');
                    box.scrollTop = box.scrollHeight;
                }).subscribe();
        }

        function appendMessage(msg) {
            const box = document.getElementById('chat-messages');
            const isMe = msg.user === currentUser;
            const msgEl = document.createElement('div');
            msgEl.className = `p-2 rounded-xl max-w-[85%] ${isMe ? 'bg-teal-500 text-slate-900 ml-auto' : 'bg-slate-700 text-white'}`;
            msgEl.innerHTML = `<p class="text-[10px] opacity-60 font-bold">${msg.user}</p><p class="mt-0.5">${msg.msg}</p>`;
            box.appendChild(msgEl);
        }

        async function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const txt = input.value.trim();
            if (!txt) return;

            input.value = '';
            await _supabase.from('chats').insert([{ user: currentUser, msg: txt }]);
        }

        // ================= XỬ LÝ VIDEO CALL NHÓM (WEBRTC) =================
        async function toggleVideoCall() {
            const grid = document.getElementById('video-grid');
            const btn = document.getElementById('call-btn');

            if (localStream) {
                // Nếu đang bật thì tắt camera đi
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
                grid.classList.add('hidden');
                btn.innerText = 'Bật Camera';
                btn.className = "bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-bold px-3 py-1 rounded-lg text-xs transition";
            } else {
                // Tiến hành kích hoạt xin quyền mở Camera + Micro điện thoại
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    document.getElementById('local-video').srcObject = localStream;
                    grid.classList.remove('hidden');
                    btn.innerText = 'Tắt Camera';
                    btn.className = "bg-rose-500 hover:bg-rose-600 text-white font-bold px-3 py-1 rounded-lg text-xs transition";
                    
                    // Khởi tạo tiến trình tạo kết nối cuộc gọi luồng
                    initWebRTCCall();
                } catch (err) {
                    alert('Điện thoại chưa cấp quyền mở camera hoặc không hỗ trợ: ' + err.message);
                }
            }
        }

        function initWebRTCCall() {
            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                const rVideo = document.getElementById('remote-video');
                rVideo.srcObject = event.streams[0];
                rVideo.classList.remove('hidden');
                document.getElementById('remote-status').classList.add('hidden');
            };
            
            // Bạn có thể phát triển thêm hệ thống truyền tín hiệu Offer/Answer thông qua Supabase Realtime nếu muốn kết nối 2 điện thoại từ xa thật
        }
    </script>
</body>
</html>
