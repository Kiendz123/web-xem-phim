<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Net Premium - Group Watch & Video Call</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: #f1f5f9; font-family: system-ui, sans-serif; }
        iframe { background-color: #000; border-radius: 12px; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div id="auth-container" class="flex flex-col items-center justify-center flex-1 px-4 py-12">
        <div class="bg-slate-900/80 backdrop-blur-md p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-800">
            <h2 id="auth-title" class="text-3xl font-extrabold mb-6 text-center text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-emerald-400">Cinema Net</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Tài khoản</label>
                    <input type="text" id="auth-username" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-teal-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Mật khẩu</label>
                    <input type="password" id="auth-password" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-teal-500 transition">
                </div>
                <button onclick="handleAuth()" id="auth-btn" class="w-full bg-gradient-to-r from-teal-500 to-emerald-500 hover:from-teal-600 hover:to-emerald-600 text-slate-950 font-bold py-3 rounded-xl transition duration-300 shadow-lg shadow-teal-500/20 mt-2">Đăng Nhập</button>
            </div>
            <p class="text-sm text-slate-400 mt-6 text-center">
                <span id="auth-toggle-text">Chưa có tài khoản?</span> 
                <button onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-teal-400 hover:underline font-semibold ml-1">Đăng ký ngay</button>
            </p>
        </div>
    </div>

    <div id="main-container" class="hidden flex-1 flex flex-col">
        <header class="bg-slate-900/50 backdrop-blur-md border-b border-slate-800/60 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
            <h1 class="text-2xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-emerald-400">🎬 CINEMA NET</h1>
            <div class="flex items-center gap-4">
                <span id="user-display" class="text-sm bg-slate-800/80 px-3 py-1.5 rounded-full border border-slate-700 text-slate-300 font-medium"></span>
                <button onclick="handleLogout()" class="bg-rose-500/10 hover:bg-rose-500 text-rose-400 hover:text-white px-4 py-1.5 rounded-xl text-sm font-semibold transition duration-200">Đăng xuất</button>
            </div>
        </header>

        <main class="flex-1 grid grid-cols-1 xl:grid-cols-4 gap-6 p-6">
            
            <div class="xl:col-span-3 flex flex-col gap-6">
                <div id="admin-controls" class="hidden bg-slate-900/60 border border-slate-800 p-5 rounded-2xl">
                    <h3 class="text-xs font-bold uppercase tracking-widest text-teal-400 mb-3">🛡️ HỆ THỐNG ĐIỀU PHỐI PHÒNG CHIẾU (ADMIN)</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <input type="text" id="movie-title" placeholder="Tên phim hoặc tiêu đề nhạc..." class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-teal-500">
                        <input type="text" id="movie-url" placeholder="Đường link YouTube / TikTok..." class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-teal-500">
                        <button onclick="updateMovieLink()" class="bg-teal-500 hover:bg-teal-600 text-slate-950 font-bold rounded-xl text-sm transition py-2.5">Cập Nhật Phòng Chiếu</button>
                    </div>

                    <div class="mt-4 border-t border-slate-800/60 pt-3">
                        <h4 class="text-xs font-semibold text-slate-400 mb-2">Kho lưu trữ danh sách phim/nhạc đã thêm:</h4>
                        <div id="admin-movie-list" class="max-h-32 overflow-y-auto space-y-1.5 text-xs text-slate-300">
                            </div>
                    </div>
                </div>

                <div class="flex-1 bg-slate-950 rounded-2xl overflow-hidden aspect-video relative border border-slate-800 shadow-2xl">
                    <div id="video-placeholder" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-slate-500">
                        <div class="text-4xl mb-2">🍿</div>
                        <p class="text-base font-medium">Chờ Admin phát video để xem nhóm...</p>
                    </div>
                    <div id="player-container" class="w-full h-full hidden">
                        </div>
                </div>
            </div>

            <div class="bg-slate-900/40 border border-slate-800 rounded-2xl flex flex-col h-[650px] xl:h-auto overflow-hidden">
                
                <div class="p-4 border-b border-slate-800 bg-slate-900/80">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-sm text-slate-200 flex items-center gap-2">📹 Phòng Gọi Truyền Hình</h3>
                        <div class="flex gap-1">
                            <button onclick="triggerCallImageSend()" id="call-img-btn" class="hidden bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded-lg text-[11px] font-medium transition">🖼️ Truyền ảnh call</button>
                            <button onclick="toggleVideoCall()" id="call-btn" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-3 py-1 rounded-lg text-[11px] transition">Bật Camera</button>
                        </div>
                    </div>
                    <div id="video-grid" class="grid grid-cols-2 gap-2 hidden">
                        <div class="bg-slate-950 aspect-video rounded-xl overflow-hidden relative border border-slate-800">
                            <video id="local-video" autoplay playsinline muted class="w-full h-full object-cover"></video>
                            <span class="absolute bottom-1.5 left-1.5 bg-slate-900/80 text-[9px] px-2 py-0.5 rounded-md text-slate-300">Bạn</span>
                        </div>
                        <div class="bg-slate-950 aspect-video rounded-xl overflow-hidden relative border border-slate-800 flex items-center justify-center">
                            <video id="remote-video" autoplay playsinline class="w-full h-full object-cover hidden"></video>
                            <div id="remote-image-display" class="w-full h-full hidden bg-slate-900 flex items-center justify-center p-1">
                                <img id="call-shared-img" class="max-w-full max-h-full object-contain rounded-lg shadow-md" src="">
                            </div>
                            <span id="remote-status" class="text-[10px] text-slate-600">Đang chờ kết nối...</span>
                            <span class="absolute bottom-1.5 left-1.5 bg-slate-900/80 text-[9px] px-2 py-0.5 rounded-md text-slate-300">Bạn bè</span>
                        </div>
                    </div>
                </div>

                <div class="flex border-b border-slate-800/60 bg-slate-900/30 text-xs font-bold text-center">
                    <button onclick="switchChatTab('public')" id="tab-public" class="flex-1 py-3 text-teal-400 border-b-2 border-teal-400 transition bg-slate-900/20">💬 Phòng Nhóm</button>
                    <button onclick="switchChatTab('private')" id="tab-private" class="flex-1 py-3 text-slate-400 hover:text-slate-200 transition">🔒 Hộp Thư Riêng Tư</button>
                </div>

                <div class="flex-1 flex flex-col overflow-hidden bg-slate-950/40">
                    <div id="private-selector-box" class="hidden p-2 bg-slate-900/60 border-b border-slate-800 flex gap-2 items-center text-xs">
                        <span class="text-slate-400 font-medium whitespace-nowrap">Gửi tới:</span>
                        <input type="text" id="private-target" placeholder="Nhập chính xác tên tài khoản nhận..." class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-white focus:outline-none focus:border-teal-500">
                    </div>

                    <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3.5 text-sm"></div>

                    <div id="emote-bar" class="px-3 py-1.5 bg-slate-900/40 border-t border-slate-800/40 flex gap-2 text-base overflow-x-auto">
                        <button onclick="insertEmote('😊')" class="hover:scale-125 transition">😊</button>
                        <button onclick="insertEmote('😂')" class="hover:scale-125 transition">😂</button>
                        <button onclick="insertEmote('🥰')" class="hover:scale-125 transition">🥰</button>
                        <button onclick="insertEmote('😎')" class="hover:scale-125 transition">😎</button>
                        <button onclick="insertEmote('🔥')" class="hover:scale-125 transition">🔥</button>
                        <button onclick="insertEmote('🎬')" class="hover:scale-125 transition">🎬</button>
                        <button onclick="insertEmote('❤️')" class="hover:scale-125 transition">❤️</button>
                    </div>

                    <div class="p-3 border-t border-slate-800 bg-slate-900/60 flex gap-2">
                        <input type="text" id="chat-input" onkeypress="if(event.key === 'Enter') sendChatMessage()" placeholder="Nhập nội dung nhắn tin..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-teal-500">
                        <button onclick="sendChatMessage()" class="bg-teal-500 hover:bg-teal-600 text-slate-950 font-bold px-5 py-2 rounded-xl text-sm transition">Gửi</button>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        // Cấu hình URL dự án và mã Key kết nối Supabase của bạn
        const SUPABASE_URL = "https://xycuajdatwcxmzneikvl.supabase.co";
        const SUPABASE_KEY = "sb_publishable_KiW3TwdbdzfphJOiqV1dZQ_Ahv4-4Om"; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Biến trạng thái hoạt động toàn cục
        let isLoginMode = true;
        let currentUser = null;
        let currentRole = 'user';
        let currentChatTab = 'public'; 
        let localStream = null;

        // Tự động kiểm tra phiên đăng nhập cũ trong máy
        window.onload = function() {
            const savedUser = localStorage.getItem('cinema_user');
            const savedRole = localStorage.getItem('cinema_role');
            if (savedUser) { loginSuccess(savedUser, savedRole); }
        };

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? 'Đăng Nhập' : 'Đăng Ký';
            document.getElementById('auth-btn').innerText = isLoginMode ? 'Đăng Nhập' : 'Đăng Ký Thành Viên';
            document.getElementById('auth-toggle-text').innerText = isLoginMode ? 'Chưa có tài khoản?' : 'Đã có tài khoản?';
            document.getElementById('auth-toggle-btn').innerText = isLoginMode ? 'Đăng ký ngay' : 'Đăng nhập tại đây';
        }

        // Xử lý xác thực Đăng nhập / Đăng ký qua bảng dữ liệu 'users' tiếng Anh chuẩn
        async function handleAuth() {
            const userVal = document.getElementById('auth-username').value.trim();
            const passVal = document.getElementById('auth-password').value.trim();
            if (!userVal || !passVal) { alert('Vui lòng điền đủ thông tin tài khoản và mật khẩu!'); return; }

            if (isLoginMode) {
                const { data, error } = await _supabase.from('users').select('*').eq('user', userVal).eq('pass', passVal);
                if (error) { alert('Hệ thống gặp lỗi: ' + error.message); } 
                else if (data && data.length > 0) { loginSuccess(data[0]['user'], data[0]['role'] || 'user'); } 
                else { alert('Tài khoản hoặc mật khẩu không chính xác!'); }
            } else {
                // Tự động trao toàn quyền Admin tối cao cho tài khoản mang tên Kienpro888
                const roleVal = (userVal === 'Kienpro888') ? 'admin' : 'user';
                const { error } = await _supabase.from('users').insert([{ "user": userVal, "pass": passVal, "role": roleVal }]);
                if (error) { alert('Lỗi đăng ký: Tài khoản đã tồn tại hoặc cơ sở dữ liệu bị ngắt!'); } 
                else { alert('Đăng ký tài khoản thành công! Hãy chuyển qua đăng nhập.'); toggleAuthMode(); }
            }
        }

        function loginSuccess(username, role) {
            currentUser = username;
            currentRole = (username === 'Kienpro888') ? 'admin' : role;
            localStorage.setItem('cinema_user', username);
            localStorage.setItem('cinema_role', currentRole);

            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('main-container').classList.remove('hidden');
            document.getElementById('user-display').innerText = `👤 ${username} [${currentRole.toUpperCase()}]`;

            // Mở tính năng quản trị nếu là Admin
            if (currentRole === 'admin') {
                document.getElementById('admin-controls').classList.remove('hidden');
                loadAdminMovieList();
            }

            // Kích hoạt toàn bộ các kênh Realtime lắng nghe dữ liệu trực tuyến
            listenToMovieUpdates();
            listenToChatMessages();
            loadInitialChat();
        }

        function handleLogout() {
            localStorage.clear();
            location.reload();
        }

        function insertEmote(emote) {
            const input = document.getElementById('chat-input');
            input.value += emote;
            input.focus();
        }

        function switchChatTab(tab) {
            currentChatTab = tab;
            const tPub = document.getElementById('tab-public');
            const tPriv = document.getElementById('tab-private');
            const selector = document.getElementById('private-selector-box');

            if (tab === 'public') {
                tPub.className = "flex-1 py-3 text-teal-400 border-b-2 border-teal-400 transition bg-slate-900/20";
                tPriv.className = "flex-1 py-3 text-slate-400 hover:text-slate-200 transition";
                selector.classList.add('hidden');
            } else {
                tPriv.className = "flex-1 py-3 text-teal-400 border-b-2 border-teal-400 transition bg-slate-900/20";
                tPub.className = "flex-1 py-3 text-slate-400 hover:text-slate-200 transition";
                selector.classList.remove('hidden');
            }
            loadInitialChat();
        }

        // ================= ĐIỀU PHỐI VÀ QUẢN LÝ VIDEO PHÒNG CHIẾU =================
        async function updateMovieLink() {
            const title = document.getElementById('movie-title').value.trim();
            const url = document.getElementById('movie-url').value.trim();
            if (!title || !url) return;

            let type = 'youtube';
            if (url.includes('tiktok.com')) type = 'tiktok';

            const { error } = await _supabase.from('movies').insert([{ title: title, url: url, type: type, added_by: currentUser }]);
            if (error) { alert("Lỗi khi thêm phim: " + error.message); }
            
            document.getElementById('movie-title').value = '';
            document.getElementById('movie-url').value = '';
            if(currentRole === 'admin') loadAdminMovieList();
        }

        async function loadAdminMovieList() {
            const { data } = await _supabase.from('movies').select('*').order('created_at', { ascending: false }).limit(20);
            const listContainer = document.getElementById('admin-movie-list');
            if (data && listContainer) {
                listContainer.innerHTML = '';
                data.forEach(m => {
                    listContainer.innerHTML += `<div class="flex justify-between items-center bg-slate-950 p-2 rounded border border-slate-800">
                        <span class="truncate pr-2">🎵 ${m.title} (${m.type})</span>
                        <button onclick="deleteMovie(${m.id})" class="text-rose-400 hover:text-rose-600 font-bold px-2 py-0.5 rounded bg-rose-500/10 transition">Xóa</button>
                    </div>`;
                });
            }
        }

        async function deleteMovie(id) {
            if(confirm("Bạn có chắc chắn muốn xóa video này khỏi kho lưu trữ?")) {
                await _supabase.from('movies').delete().eq('id', id);
                loadAdminMovieList();
            }
        }

        function listenToMovieUpdates() {
            _supabase.from('movies').select('*').order('created_at', { ascending: false }).limit(1)
                .then(({ data }) => { if(data && data.length > 0) renderPlayer(data[0]); });

            _supabase.channel('movie_channel_global')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'movies' }, payload => {
                    renderPlayer(payload.new);
                }).subscribe();
            
            // Lắng nghe thêm sự kiện xóa phim để cập nhật kho lưu trữ cho Admin
            _supabase.channel('movie_delete_channel')
                .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'movies' }, () => {
                    if(currentRole === 'admin') loadAdminMovieList();
                }).subscribe();
        }

        function renderPlayer(movie) {
            document.getElementById('video-placeholder').classList.add('hidden');
            const container = document.getElementById('player-container');
            container.classList.remove('hidden');

            if (movie.type === 'youtube') {
                let videoId = '';
                if(movie.url.includes('v=')) videoId = movie.url.split('v=')[1].split('&')[0];
                else if(movie.url.includes('youtu.be/')) videoId = movie.url.split('youtu.be/')[1].split('?')[0];
                container.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" class="w-full h-full" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
            } else if (movie.type === 'tiktok') {
                let videoId = movie.url.split('/video/')[1]?.split('?')[0] || '';
                container.innerHTML = `<iframe src="https://www.tiktok.com/embed/v2/${videoId}" class="w-full h-full" allowfullscreen></iframe>`;
            }
        }

        // ================= HỆ THỐNG TRÒ CHUYỆN (NHÓM CHUNG & RIÊNG TƯ) =================
        async function loadInitialChat() {
            const box = document.getElementById('chat-messages');
            box.innerHTML = '';
            
            if (currentChatTab === 'public') {
                const { data } = await _supabase.from('chats').select('*').order('created_at', { ascending: true }).limit(60);
                if (data) data.forEach(msg => appendMessage(msg.user, msg.msg, msg.user === currentUser));
            } else {
                const { data } = await _supabase.from('chats_private').select('*').or(`sender.eq.${currentUser},receiver.eq.${currentUser}`).order('created_at', { ascending: true });
                if (data) data.forEach(msg => {
                    const label = msg.sender === currentUser ? `To: ${msg.receiver}` : `From: ${msg.sender}`;
                    appendMessage(label, msg.msg, msg.sender === currentUser, msg.is_image);
                });
            }
            box.scrollTop = box.scrollHeight;
        }

        function listenToChatMessages() {
            _supabase.channel('public_chat_system')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chats' }, payload => {
                    if (currentChatTab === 'public') {
                        appendMessage(payload.new.user, payload.new.msg, payload.new.user === currentUser);
                        document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;
                    }
                }).subscribe();

            _supabase.channel('private_chat_system')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chats_private' }, payload => {
                    const info = payload.new;
                    if (info.sender === currentUser || info.receiver === currentUser) {
                        // Kích hoạt luồng truyền ảnh hiển thị lên khung Call nếu có tín hiệu ảnh được gửi tới bạn
                        if (info.is_image && info.receiver === currentUser) {
                            showSharedImageOnCall(info.msg);
                        }
                        if (currentChatTab === 'private') {
                            const label = info.sender === currentUser ? `To: ${info.receiver}` : `From: ${info.sender}`;
                            appendMessage(label, info.msg, info.sender === currentUser, info.is_image);
                            document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;
                        }
                    }
                }).subscribe();
        }

        function appendMessage(sender, msg, isMe, isImage = false) {
            const box = document.getElementById('chat-messages');
            const msgEl = document.createElement('div');
            msgEl.className = `p-2.5 rounded-xl max-w-[85%] ${isMe ? 'bg-gradient-to-r from-teal-500 to-emerald-500 text-slate-950 ml-auto font-medium shadow-md' : 'bg-slate-800 text-slate-100'}`;
            
            if (isImage) {
                msgEl.innerHTML = `<p class="text-[9px] opacity-60 font-bold mb-1">${sender}</p><img src="${msg}" class="rounded-lg max-w-full h-auto border border-black/10" alt="Ảnh truyền nhận">`;
            } else {
                msgEl.innerHTML = `<p class="text-[9px] ${isMe ? 'text-slate-800' : 'text-slate-400'} font-bold">${sender}</p><p class="mt-0.5 break-words">${msg}</p>`;
            }
            box.appendChild(msgEl);
        }

        async function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const txt = input.value.trim();
            if (!txt) return;
            input.value = '';

            if (currentChatTab === 'public') {
                await _supabase.from('chats').insert([{ user: currentUser, msg: txt }]);
            } else {
                const target = document.getElementById('private-target').value.trim();
                if (!target) { alert('Mẹo: Điền chính xác tên tài khoản nhận vào ô "Gửi tới" trước khi nhắn tin mật nhé!'); return; }
                await _supabase.from('chats_private').insert([{ sender: currentUser, receiver: target, msg: txt, is_image: false }]);
            }
        }

        // ================= HỆ THỐNG PHÒNG GỌI TRUYỀN HÌNH & TRUYỀN ẢNH =================
        async function toggleVideoCall() {
            const grid = document.getElementById('video-grid');
            const btn = document.getElementById('call-btn');
            const imgBtn = document.getElementById('call-img-btn');

            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
                grid.classList.add('hidden');
                imgBtn.classList.add('hidden');
                btn.innerText = 'Bật Camera';
                btn.className = "bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-3 py-1 rounded-lg text-[11px] transition";
            } else {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    document.getElementById('local-video').srcObject = localStream;
                    grid.classList.remove('hidden');
                    imgBtn.classList.remove('hidden');
                    btn.innerText = 'Tắt Camera';
                    btn.className = "bg-rose-500 hover:bg-rose-600 text-white font-bold px-3 py-1 rounded-lg text-[11px] transition";
                } catch (err) { alert('Không kết nối được thiết bị Camera/Microphone: ' + err.message); }
            }
        }

        async function triggerCallImageSend() {
            const target = document.getElementById('private-target').value.trim();
            if (currentChatTab !== 'private' || !target) {
                alert('Mẹo truyền hình ảnh cuộc gọi: Bạn bấm chọn Tab "Hộp thư riêng tư", điền tên tài khoản bạn bè vào ô "Gửi tới", rồi quay lại bấm nút này nhé!');
                return;
            }
            const imgUrl = prompt("Dán đường link hình ảnh (link chứa đuôi định dạng .jpg, .png, .gif...) bạn muốn hiển thị trực tiếp lên luồng cuộc gọi đối phương:");
            if (!imgUrl) return;

            // Đẩy tín hiệu ảnh qua cơ chế bảng dữ liệu Supabase
            await _supabase.from('chats_private').insert([{ sender: currentUser, receiver: target, msg: imgUrl, is_image: true }]);
        }

        function showSharedImageOnCall(url) {
            const rVideo = document.getElementById('remote-video');
            const rImgDisplay = document.getElementById('remote-image-display');
            const sharedImg = document.getElementById('call-shared-img');
            const statusText = document.getElementById('remote-status');

            if(statusText) statusText.classList.add('hidden');
            if(rVideo) rVideo.classList.add('hidden');
            
            sharedImg.src = url;
            if(rImgDisplay) rImgDisplay.classList.remove('hidden');
        }
    </script>
</body>
</html>
